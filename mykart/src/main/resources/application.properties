# ═══════════════════════════════════════════════════════════
# MyKart Application Configuration
# ═══════════════════════════════════════════════════════════

# ─── Application Name ───
spring.application.name=mykart

# ─── H2 In-Memory Database Configuration ───
# H2 ek in-memory database hai — application band hone pe data gayab ho jaata hai
# Development/testing ke liye perfect hai
spring.datasource.url=jdbc:h2:mem:shopdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console — browser mein DB dekhne ke liye (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA Settings ───
# create-drop: Har baar app start hone pe tables banayega, band hone pe drop karega
spring.jpa.hibernate.ddl-auto=create-drop

# ─── JWT Configuration ───
# Secret Key (Base64-encoded) — Yeh key JWT tokens sign karne ke liye use hoti hai
# IMPORTANT: Production mein yeh key environment variable se aani chahiye, hardcode NAHI!
# Yeh 256-bit (32 bytes) key hai — HMAC-SHA256 ke liye minimum requirement
jwt.secret=dGhpcyBpcyBhIHNlY3VyZSBrZXkgZm9yIG15a2FydCBhcHBsaWNhdGlvbiEhIQ==

# Token Expiration (milliseconds) — 24 hours = 86400000ms
jwt.expiration=86400000
